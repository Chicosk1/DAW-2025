<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mini MovieBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <h1>Mini MovieBox</h1>
    </header>

    <main>

        <section class="area-busca">
            <input type="text" placeholder="Buscar filmes...">
        </section>

        <section class="destaque">
            <h2>Filme em destaque</h2>

            <div class="card">
                <img src="https://via.placeholder.com/400x250" alt="Poster do filme">

                <div class="conteudo-card">
                    <h3>Filme Exemplo</h3>
                    <p class="ano">2025</p>

                    <p class="descricao">
                        Este é um pequeno exemplo de card utilizado para praticar HTML e CSS.
                    </p>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
